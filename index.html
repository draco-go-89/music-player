<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUBO LABAO - MUSIC PLAYER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="page2.html" class="img-btn textt" target="_blank" title="page2">Play better here</a>

    <button id="openAboutBtn" class="image-button">
        <img src="images/white.png" alt="About">
    </button>
    
    <div id="aboutModal" class="modal-backdrop">
    
        <div class="modal-content">
            <button id="closeAboutBtn" class="close-btn">&times;</button>
            <h2></h2>
            <p>there will always always always be a quite carefree</p>
            <p>places in the world</p>
            <p>and i will always find my way</p>
            <p>back to them in the end</p>
            <!-- THE BUTTON IS HIDDEN AS A WHITE PNG BESIDE THE WEEKND BOTTOM -->
            <p></p>
            <!-- <a href="page2.html" class="img-btn textt" target="_blank" title="page2">Play better here</a> -->
        </div>
    </div>
     
    <div class="door-frame">
        <div class="nimbu"></div>
    </div>

    <div class="player">
        <img src="images/image3.jpg" class="cover">
        <!-- <p>Now Playing</p> -->
        <h2 id="title">Song Title</h2>
        <p id="artist">Artist Name</p>

        <audio id="audio"></audio>

        <div class="controls">
            <button id="prev">⏮️</button>
            <button id="play">▶️</button>
            <button id="next">⏭️</button>
        </div>
        
        <div class="progress">
            <i class="progress-icon">🎵</i>
            <input type="range" id="progress" value="0">
        </div>

        <div class="volume">
            <i class="vol-icon">🔊</i>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>
        <!-- <footer>© 2026 Lubo Labao | All Rights Reserved 🤺</footer> -->
    </div>
    <script src="script.js"></script>
</body>

</html>
